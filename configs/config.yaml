# config.yaml

meta:
  run_all_profiles: true            # Tek komutla tüm profilleri sırasıyla çalıştır.
  profiles_order: ["aggressive", "balanced", "defensive"]  # Profillerin varsayılan çalıştırma sırası.
  profiles_dirname: "outputs"       # Tüm deney çıktılarını tutan üst dizin.

globals:                            # Profillerin devraldığı varsayılan ayarlar.
  data:                             # Piyasa verisi ve örnekleme yapılandırması.
    coin_list: ["BTCUSDT"]          # Eğitim ve testte kullanılacak semboller.
    interval: "1h"                  # Mum aralığı (1m, 5m, 15m, 1h, 4h, 1d).
    lookback: 200                   # Her adımda ajana sunulan geçmiş mum sayısı.
    train_range: ["2021-06-01 00:00:00", "2024-12-31 00:00:00"]  # Eğitim aralığı (değiştirmek kıyaslamayı bozar).
    val_range:   ["2024-01-01 00:00:00", "2024-06-30 00:00:00"]  # Erken durdurma ve izleme için doğrulama aralığı.
    test_range:  ["2024-06-30 00:01:00", "2025-06-30 00:00:00"]  # Varsayılan test aralığı (eğitim/uyumluluk için).
    test_ranges:                      # Birden fazla test senaryosu tanımlamak için ek aralıklar.
      testH: ["2024-06-30 00:01:00", "2025-01-01 00:00:00"]     # Yüksek volatil dönem (örnek).
      testL: ["2025-01-01 00:01:00", "2025-06-30 00:00:00"]     # Daha sakin dönem (örnek).
    use_binance_api: false          # true ise canlı veri çeker, false ise offline parquet dosyasını kullanır.
    offline_data_path: "data/processed/coin_data.parquet"  # API kapalıyken okunan veri dosyası.

  environment:                      # İşlem ortamına ait parametreler.
    initial_balance: 10000          # Her bölümde başlangıç portföy değeri.
    commission: 0.001               # İşlem başına komisyon (0.001 = %0.1).
    use_one_hot_position: true      # Pozisyonu tek değer yerine one-hot vektörle ifade et.

  reward:                           # Basit doğruluk odaklı ödül ayarları.
    correct: 1.0                    # Tahmin doğruysa verilecek ödül.
    incorrect: -1.0                 # Tahmin yanlışsa verilecek ceza.
    tolerance: 0.0                  # Fiyat değişimi bu mutlak eşiğin altındaysa “yatay” sayılır (ödül 0).

  ppo:                              # PPO algoritmasının temel hiperparametreleri.
    gamma: 0.98                      # İskonto oranı; düşük değer kısa vadeye odaklanır.
    lam: 0.98                       # GAE lambda; yüksek değer düşük bias fakat yüksek varyans üretir.
    learning_rate: 0.0004           # Optimizasyon öğrenme hızı.
    clip_epsilon: 0.5               # PPO clipping eşiği (oran [1-eps, 1+eps] dışına çıkarsa ceza uygulanır).
    entropy_coeff: 0.8              # Keşfi teşvik eden başlangıç entropi katsayısı.
    entropy_min_coeff: 0.1          # Entropi katsayısının inebileceği alt sınır.
    entropy_decay_epochs: 0.8       # Entropi katsayısının lineer olarak düşeceği epoch yüzdesi.
    value_coeff: 0.5                # Value kaybının politika kaybına göre ağırlığı.
    epochs: 10                      # Her rollout sonrasında yapılan optimizasyon epoch sayısı.
    minibatch_size: 64              # Rollout verisinden çekilen minibatch boyutu.
    rollout_steps: 256             # Her güncellemeden önce toplanan deneyim uzunluğu.
    max_grad_norm: 100              # Gradient clipping sınırı (daha küçük değerle patlamaları önle).
    # Deneme amaçlı alternatif ayarlar (gerekirse yorumdan çıkar):
    # gamma: 0.90
    # lam: 0.95
    # learning_rate: 0.0003
    # clip_epsilon: 0.2
    # entropy_coeff: 0.4
    # value_coeff: 0.3
    # epochs: 10
    # minibatch_size: 64
    # rollout_steps: 4096
    # max_grad_norm: 0.5

  training:                         # Eğitim döngüsü ve loglama tercihleri.
    total_epochs: 400               # Maksimum PPO epoch sayısı.
    validate_every: 100             # Kaç epochta bir doğrulama yapılacağı (0 → devre dışı).
    best_metric: "total_reward"       # En iyi modelin seçilmesinde izlenecek metrik.
    save_best_model: true           # En iyi kontrol noktasını diske kaydet.
    model_save_path: "outputs/models/best_model.pth"  # Profil klasörü oluşmadan önce kullanılan varsayılan dosya.
    log_path: "outputs/logs/train_logs.csv"           # Eğitim loglarının varsayılan yolu.

  test:                             # Backtest sırasında kullanılan ayarlar.
    use_deterministic_policy: true  # true ise politika deterministik, false ise örneklemeli çalışır.
    backtest_log_path: "outputs/results/trades_log.csv"  # Tüm adım ve portföy kayıtlarının tutulduğu tek CSV.

  backtest:                         # Değerlendirme sonrası raporlama tercihleri.
    plot_equity_curve: true         # Backtest sonunda equity grafiği çiz ve kaydet.
    save_report: true               # Text/CSV formatında özet rapor oluştur (uygulamaya bağlı).

  device: "cpu"                     # Çalışma cihazı ("cpu" ya da "cuda").
  seed: 42                          # Rastgelelik tohumu; tekrar üretilebilir sonuçlar için sabit tut.

  optimization:                     # Hiperparametre araması yapılandırması.
    ga:
      population_size: 8            # Nesil başına birey sayısı.
      generations: 30                # Gelişim derinliği (yüksek değer daha maliyetli).
      elite_fraction: 0.1           # En iyi bireylerin korunacağı oran.
      crossover_rate: 0.8           # Çaprazlama uygulanma olasılığı.
      mutation_rate: 0.7            # Her gen için mutasyon uygulanma olasılığı.
      mutation_scale: 0.8           # Mutasyon gürültüsünün parametre aralığına göre ölçeği.
      max_workers: 16                # Paralel değerlendirme işçisi sayısı.
      evaluation_epochs: 250        # GA sırasında kullanılan eğitim epoch sayısı (kısa tutulur).
      evaluation_validate_every: 50 # GA değerlendirmelerinde doğrulama sıklığı.
      volatility_weight: 0.2        # GA fitness hesabında volatiliteye uygulanan ağırlık.
      search_space:                 # GA'nın dolaşacağı alt/üst sınırlar.
        ppo.gamma: [0.2, 0.6]
        ppo.lam: [0.9, 0.999]
        ppo.learning_rate: [1e-4, 1e-3]
        ppo.clip_epsilon: [0.1, 1.0]
        ppo.entropy_coeff: [0.2, 1.0]
        ppo.entropy_min_coeff: [0.05, 0.3]
        ppo.value_coeff: [0.1, 1.0]
      log_scaled:
        - ppo.learning_rate         # Öğrenme hızını logaritmik ölçekte örnekle.

profiles:                           # Profiller yalnızca farklılaşan alanları yazar.
  aggressive:
    reward:
      correct: 1.5                 # Doğru tahminlerde yüksek puan, yanlıştaysa sert ceza.
      incorrect: -1.5
      tolerance: 0.0               # Mikro hareketleri bile değerlendirsin.
    ppo:
      entropy_coeff: 0.6           # Daha fazla keşif.
      clip_epsilon: 0.4
    training:
      total_epochs: 350

  balanced:
    reward:
      correct: 1.0
      incorrect: -1.0
      tolerance: 0.0005            # ±0.05% değişimleri “yatay” say.


  defensive:
    reward:
      correct: 0.8
      incorrect: -0.8
      tolerance: 0.0010            # Daha geniş tolerans → yalnızca belirgin hareketlerde puan.
    ppo:
      entropy_coeff: 0.25          # Daha deterministik politika.
      clip_epsilon: 0.2
    training:
      total_epochs: 300
